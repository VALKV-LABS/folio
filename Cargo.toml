[workspace]
resolver = "2"
members = [
    "crates/folio-core",
    "crates/folio-ledger",
    "crates/folio-node",
    "bins/foliod",
]

[workspace.package]
version = "0.1.0"
edition  = "2024"
license  = "MIT"

[workspace.dependencies]
# async runtime
tokio        = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
futures      = "0.3"
futures-util = "0.3"
async-trait  = "0.1"

# serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost      = "0.13"
bincode    = "1.3"
bytes      = { version = "1.10", features = ["serde"] }

# error / observability
anyhow             = "1.0"
thiserror          = "2.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
prometheus         = { version = "0.13", features = ["process"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# storage
fjall = "2"
moka  = { version = "0.12", features = ["future"] }

# networking / RPC
tonic       = { version = "0.12", features = ["tls", "transport"] }
etcd-client = "0.17"

# cloud
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# misc
parking_lot  = "0.12"
crc32fast    = "1.4"
dashmap      = "6"
hmac         = "0.12"
sha2         = "0.10"
uuid         = { version = "1.18", features = ["v4", "serde"] }
tempfile     = "3.23"
libc         = "0.2"
tokio-uring  = "0.4"

# internal crates
folio-core   = { path = "crates/folio-core" }
folio-ledger = { path = "crates/folio-ledger" }
folio-node   = { path = "crates/folio-node" }

[patch.crates-io]
sfv = { git = "https://github.com/undef1nd/sfv", tag = "v0.9.4" }
